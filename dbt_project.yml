name: 'intercom_case'
version: '1.0.0'
config-version: 2

profile: 'intercom_case'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # dbt_date.now(), used by dbt_expectations' moving-stdev anomaly test.
  "dbt_date:time_zone": "UTC"
  # How many recent periods the anomaly test checks. The sample data ends
  # 2025-01-08, so the default window finds nothing; pass a larger value
  # with --vars to run it against the sample.
  anomaly_test_periods: 14

models:
  intercom_case:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
