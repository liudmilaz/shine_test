name: 'intercom_case'
version: '1.0.0'
config-version: 2

profile: 'intercom_case'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# One schema per layer, same names in dev (SHINE_DEV) and prod
# (SHINE_ANALYTICS_PROD) - see macros/generate_schema_name.sql.
models:
  intercom_case:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
