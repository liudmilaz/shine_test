version: 2

models:
  - name: int_dim_clients_current
    description: >
      The current (_is_latest) version of each real client: one row per
      client, test accounts excluded. The unique test guarantees no client
      has two "latest" rows.
    columns:
      - name: sev_client_id
        data_tests:
          - unique
          - not_null

  - name: int_intercom_conversation_metrics
    description: One row per conversation, with elapsed-time metrics resolved via aggregation instead of a fan-out join.
    columns:
      - name: conversation_id
        data_tests:
          - unique
          - not_null
      - name: sev_client_id
        data_tests:
          - not_null
          # Every conversation must belong to a known client (test accounts
          # included, so this checks dim_clients, not the real-clients-only
          # int_dim_clients_current). The daily fact inner-joins clients, so
          # this is what stops a conversation from disappearing silently.
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: sev_client_id
      - name: date_day
        data_tests:
          - not_null
      - name: is_awaiting_first_reply
        data_tests:
          - not_null
