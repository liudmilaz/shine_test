version: 2

models:
  - name: int_dim_clients_current
    description: >
      dim_clients deduped to exactly one "current" row per client.
      _is_latest alone isn't safe to trust (see CODE_REVIEW.md) -
      the unique test below is what would have caught that in CI.
    columns:
      - name: sev_client_id
        data_tests:
          - unique
          - not_null

  - name: int_intercom_conversation_metrics
    description: One row per conversation, with elapsed-time metrics resolved via aggregation instead of a fan-out join.
    columns:
      - name: conversation_id
        data_tests:
          - unique
          - not_null
      - name: sev_client_id
        data_tests:
          - not_null
          # The fct model left-joins clients so orphans aren't dropped;
          # this surfaces them instead of letting them pass silently.
          - relationships:
              arguments:
                to: ref('int_dim_clients_current')
                field: sev_client_id
      - name: date_day
        data_tests:
          - not_null
      - name: is_awaiting_first_reply
        data_tests:
          - not_null
