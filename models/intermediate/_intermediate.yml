version: 2

models:
  - name: int_dim_clients_current
    description: >
      The current (_is_latest) version of each real client: one row per
      client (test accounts are already excluded in dim_clients). The unique
      test guarantees no client has two "latest" rows.
    columns:
      - name: sev_client_id
        data_tests:
          - unique
          - not_null

  - name: int_intercom_conversation_metrics
    description: One row per conversation, with elapsed-time metrics resolved via aggregation instead of a fan-out join.
    columns:
      - name: conversation_id
        data_tests:
          - unique
          - not_null
      - name: sev_client_id
        data_tests:
          - not_null
          # Every conversation must belong to a known client. Checked against
          # stg_clients, which still includes test accounts; dim_clients holds
          # real clients only. The marts inner-join clients, so this is what
          # stops a conversation from disappearing silently.
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: sev_client_id
      - name: date_day
        data_tests:
          - not_null
      - name: is_awaiting_first_reply
        data_tests:
          - not_null
